baseURL = "https://example.org/"
languageCode = "en-us"
title = "A Kavu Garden"
theme = "kavu"
themesdir = "../../"
copyright = "Example Gardener"
relativeURLs = false
canonifyURLs = false
enableRobotsTXT = true

[params]
  name = "Example Gardener"
  description = "A demo digital garden built with the Kavu Hugo theme."
  initials = "kavu"
  googleAnalytics = ""

  # Kavu theme params (all optional — the theme renders cleanly without
  # any of these set. They are listed here to show what's available;
  # replace the example values with your own).
  author = "Example Gardener"
  authorURL = "https://example.org/"
  tagline = "A demo digital garden"
  # twitterHandle = "@your-handle"
  # defaultOgImage = "/img/og-cover.png"
  # keywords = ["digital garden", "notes"]
  # locale = "en_US"
  # headerLogoURL = "https://example.org/"
  # headerBrandText = "your name"
  # headerLogoLight = "img/logo-light.png"
  # headerLogoDark  = "img/logo-dark.png"
  # hideThemeCredit = true   # set to true to hide the "Built with Kavu" footer line

  # [[params.social]]
  #   name = "GitHub"
  #   link = "https://github.com/your-username"
  #   icon = "fab fa-github"

  # heroLinks render in the hero sidebar next to the Random Note button.
  [[params.heroLinks]]
    name = "What is a digital garden?"
    url = "/notes/what-is-a-digital-garden/"

  # [[params.footerLinks]]
  #   name = "About"
  #   url = "/about/"


[menu]
  [[menu.main]]
    name = "notes"
    url = "/notes/"
    weight = 1


[taxonomies]
  tag = "tags"


[markup]
  defaultMarkdownHandler = 'goldmark'
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.parser]
    autoHeadingID = true
    autoHeadingIDType = 'github'
    wrapStandAloneImageWithinParagraph = true
    [markup.goldmark.parser.attribute]
      block = false
      title = true
  [markup.goldmark.extensions]
    definitionList = true
    footnote = true
    linkify = true
    strikethrough = true
    table = true
    taskList = true
    typographer = true
  [markup.highlight]
    noClasses = false
    style = 'monokai'

[outputFormats.JSON]
  mediaType = "application/json"
  baseName = "index"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["HTML", "RSS", "JSON"]
