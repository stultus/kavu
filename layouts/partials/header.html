{{ $currentURL := .RelPermalink }}
<nav style="padding: 1rem 0; margin-bottom: 2rem;">
    <div style="max-width: 90ch; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 0 1.5rem; min-height: 42px;">
        <a href="https://stultus.in/" style="display: inline-flex; align-items: center; gap: 0.5rem; border-bottom: none; text-decoration: none; line-height: 1;">
            <img src="{{ "img/logo-light.png" | relURL }}" alt="stultus" class="nav-logo nav-logo-light" style="height: 36px; width: auto; margin: 0;">
            <img src="{{ "img/logo-dark.png" | relURL }}" alt="stultus" class="nav-logo nav-logo-dark" style="height: 36px; width: auto; margin: 0; display: none;">
            <span style="font-family: var(--font-heading); font-weight: 600; font-size: 18px; color: var(--text-primary); line-height: 1;">stultus</span>
        </a>
        <ul style="display: flex; gap: 1.5rem; list-style: none; margin: 0; padding: 0; align-items: center;">
            {{ range .Site.Menus.main }}
                <li style="margin: 0;">
                    <a href="{{ .URL }}" style="border-bottom: none; font-family: var(--font-body); font-size: 0.9rem; color: var(--text-primary);{{ if hasPrefix $currentURL .URL }} color: var(--accent); font-weight: 700; border-bottom: 2px solid var(--accent); padding-bottom: 2px;{{ end }}">{{ .Name }}</a>
                </li>
            {{ end }}
        </ul>
    </div>
    <hr style="border: none; border-top: 1px solid var(--border); margin: 1rem auto 0; max-width: 90ch;">
</nav>
<style>
    body.dark-theme .nav-logo-light { display: none !important; }
    body.dark-theme .nav-logo-dark { display: block !important; }
</style>
